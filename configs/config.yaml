# LuyDek configuration. Paths are relative to the project root.
# Secrets (TELEGRAM_BOT_TOKEN, ANTHROPIC_API_KEY) live in .env, never here.

shop:
  name: "Demo Mini-Mart"
  timezone: "Asia/Phnom_Penh"
  currency: "USD"
  # A Telegram user becomes a verifier by sending: /start 2468
  pin: "2468"
  default_lang: "km"
  # Demo and install-team tools: send-now buttons, photo upload, pilot report, Telegram previews.
  # Turn off for a real pilot so the owner sees only what they need.
  team_tools: true

paths:
  db: data/luydek.db
  media: data/media
  seed_catalog: data/seed_catalog.yaml

recognition:
  model_name: openai/clip-vit-base-patch32
  device: auto
  # Confidence tiers over CLIP image-to-image cosine similarity.
  # Raw CLIP scores sit in a narrow 0.75-0.95 band, so these are NOT the
  # handoff's 0.90/0.60. Re-derive them from your own enrolled gallery with
  # `python scripts/calibrate.py` and paste the suggested values here.
  t_high: 0.88       # top-1 score for auto-accept ...
  m_high: 0.03       # ... AND at least this far ahead of the runner-up
  t_low: 0.76        # below this the owner gets the photo grid instead of a yes/no
  top_k_per_pack: 3  # a pack's score is the mean of its best k gallery matches
  learn_cap: 20      # owner "Yes" and corrections become photos; keep the newest 20 per product
  # Look-alikes that differ only in colour (blue vs black pen): a colour histogram breaks the tie.
  colour_tiebreak: true
  lookalike_gap: 0.05  # candidates within this CLIP score of the top one count as look-alikes
  colour_margin: 0.15  # the colour match must beat the runner-up by this much to decide
  # Size on the mat (calibrated counter camera only): an item outside the size range of a product's own
  # photos, widened by size_tolerance both ways, is asked about, never recorded on its own. A 330ml can
  # and a 1.5L bottle of the same brand look alike; their size doesn't. Changing the counter camera's
  # zoom changes sizes too: re-take a few photos of each product after that, or switch this off.
  size_check: true
  size_tolerance: 1.4
  size_min_photos: 3   # counter-camera photos a product needs before its size is used
  # Look-alike pairs are found from the shop's own photos (Products page). When the top two guesses
  # are such a pair, the item is asked about unless the first leads by at least this much.
  pair_margin: 0.08
  # Nothing that might be a sale is dropped silently. Things you taught it to ignore (phone, cash, a
  # hand) are set aside only on a clear match; "other" (from "Not a sale" answers) is always asked
  # about, except a patch of mat this close to one you already said wasn't a sale. Set-aside things
  # stay in the camera log (/log) for ignored_keep_days, where "It was a sale" still records them.
  ignore_min: 0.85
  ignore_margin: 0.03
  junk_repeat: 0.95
  background_sim: 0.9     # looks this much like the empty mat at that spot: never recorded without asking
  ignored_keep_days: 14
  enroll_duplicate: 0.985  # hold-to-record: skip a photo this close to one the product already has
  segment:
    work_width: 960        # frames are compared at this width
    diff_threshold: 30     # LAB distance that counts as "something is here"
    lightness_weight: 0.8  # <1 ignores soft shadows; white boxes on a pale mat need it near 1
    min_area_frac: 0.004   # ignore specks smaller than 0.4% of the mat
    max_area_frac: 0.60    # a blob this big is a lighting change or an arm
    pad_frac: 0.08         # crop margin around each item
    split_touching: true   # separate two items that touch (a narrow neck between them)
    split_solidity: 0.93   # only a dented outline (less convex than this) can be two items
    split_peak: 0.75
    split_min_frac: 0.12
    # With a calibrated camera, this share of the mat looking different from the empty-counter
    # photo means the camera moved or the light changed: the counter page asks for a recalibration
    # instead of recording a sale. Real sales so far covered at most ~70% of the view.
    scene_change_frac: 0.85

  # Pharmacies: loose tablets go on a small black card (marked on the Counter page) and are
  # counted there; the box they came from, put beside it, says which medicine it is.
  tray:
    diff_threshold: 40
    min_piece_frac: 0.002   # of the tray: smaller is a crumb
    max_piece_frac: 0.30    # of the tray: bigger is not tablets
    unit_tolerance: 0.35    # a piece must be within 0.35 of a whole number of tablets to be sure
    min_unit_samples: 2     # checked counts needed before the tray trusts a tablet's size

verification:
  # Batched digests at quiet moments, never one message per sale.
  digest_times: ["09:30", "13:00", "20:30"]
  # Anything still unchecked is accepted as the best guess and flagged.
  end_of_day: "22:00"
  # Right after end_of_day, every registered phone gets the day's summary: what sold, what came in,
  # what is running out. Anyone can also ask for it (/today) and for stock left (/stock, or type a name).
  daily_summary: true
  # The moment a product runs out or runs low, every registered phone is told (once, until it's back).
  stock_alerts: true
  # Each day a few products get a quick count on Telegram ("is there really 4 left?"): low and out
  # first, then best sellers, none twice in a week. Counts that match are logged too.
  spot_checks: 3
  spot_check_time: "15:00"
  # Once a week, a walk round the shop place by place: what has expired, what to put in front, and
  # what won't sell before it expires. Also any time with /shelf.
  shelf_check_weekday: 0        # 0 = Monday
  shelf_check_time: "08:30"
  weekly_summary_time: "20:45"   # Sundays
  # Privacy: once every item in a sale is settled, the full counter photo is
  # deleted and only the per-product crops are kept.
  delete_photos_after_verify: true
  stale_transaction_minutes: 10

forecast:
  history_days: 28
  week_weights: [4, 3, 2, 1]     # most recent week first
  safety_days: 2
  safety_days_critical: 3
  overstock_extra_days: 14       # SKIP when stock covers the cycle plus this
  skip_no_sales_days: 30
  sleeping_days: 45              # no sale in this long = sleeping money
  sleeping_cover_days: 90        # ... or this many days of stock at the current pace
  expiry_warning_days: 30
  order_list_time: "18:00"       # sent the evening before each agent's visit
  observe_until: null            # e.g. "2026-10-12": no recommendations before this date

labels:
  # When the camera's best guesses are look-alikes (Paracetamol 250mg vs 500mg), send just
  # the product crop to Claude to read the printed size or strength. Needs ANTHROPIC_API_KEY.
  enabled: true
  model: claude-opus-5
  gap: 0.05                 # guesses within this score of the top one count as look-alikes
  max_options: 4
  # Something the camera can't place at all: read its name off the package so the owner can
  # add it as a new product with one tap (Today page and Telegram).
  name_new: true
  name_match: 0.9           # a name read this close to an existing product's name is that product

pilot:
  start: null               # e.g. "2026-10-01"; empty = the first day stock was recorded
  baseline_weeks: 2         # the observation weeks the pilot report compares against
  report_weeks: 12          # at most this many weeks on the report

invoices:
  model: claude-opus-5
  max_long_edge: 1568       # images are downscaled to this before upload
  khr_per_usd: 4100         # riel invoices are costed in dollars at this rate

telegram:
  enabled: true
  # The Mini App (swipe right/left to check items inside Telegram) needs an https address that
  # Telegram can open on the phone, e.g. from `tailscale serve --bg 8000`. With it, each digest is
  # one message with a "Check N items" button; without it, one photo message per item as before.
  miniapp_url: https://kyoo-1.tail4f6f49.ts.net   # this laptop, via `tailscale serve` (tailnet only)
  miniapp_host_only: false  # true if that address is PUBLIC (a tunnel): it then serves only the Mini App
