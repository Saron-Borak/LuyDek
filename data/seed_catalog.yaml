# Demo catalog: 16 products (one sold by the tablet), 4 supplier agents, 3 look-alike pairs
# (Ichitan / Oishi green tea, Dutch Lady chocolate / strawberry, Paracetamol 250 / 500).
# Edit this to match the real products bought for the demo, then run
#   python scripts/seed_demo.py --reset
#
# visit_weekday: 0 = Monday ... 6 = Sunday
# sim: parameters for scripts/simulate_history.py only (SIMULATED history).
#   rate           average units sold per day
#   start_stock    units on the shelf at the start of the simulation
#   feeling_cases  cases the owner orders "by feeling" at every agent visit
#   trend          weekly growth of demand (1.15 = +15% a week, e.g. fever season)
#   forget_visits  visits (counted from the end, 1 = most recent) where the owner forgot to order

suppliers:
  - name: Coca-Cola agent
    emoji: "🥤"
    visit_weekday: 1
    min_order: 20
    contact: "Agent Dara 012 345 678"
  - name: Snack & drink distributor
    emoji: "🍵"
    visit_weekday: 3
    min_order: 15
  - name: Dairy & baby distributor
    emoji: "🍼"
    visit_weekday: 4
    min_order: 25
  - name: Pharma distributor
    emoji: "💊"
    visit_weekday: 0
    min_order: 30

products:
