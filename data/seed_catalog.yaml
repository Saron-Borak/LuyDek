    name_en: Coca-Cola can 330ml
    name_km: កូកាកូឡា កំប៉ុង 330ml
    unit: can
    case_size: 24
    supplier: Coca-Cola agent
    critical: true
    shelf_life_days: 270
    unit_cost: 0.38
    packs:
      - {label: "6-pack", units: 6}
    aliases: [coke, coca 330, coca cola 330, កូកា, កូកាកំប៉ុង]
    sim: {rate: 6.2, start_stock: 60, feeling_cases: 2}
